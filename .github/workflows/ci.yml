name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Format
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      # From M2 on, every card must validate and carry a test.
      - name: Card lint
        run: npm run card-lint

      # The M3 gate: random play must complete without crashing, stalling, or
      # the engine offering an action it then refuses.
      - name: Simulate games
        run: npm run sim -- --games 500
